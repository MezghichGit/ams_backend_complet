server.port=9191
eureka.instance.prefer-ip-address=true

# CORS
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[5]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=false
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# Filtres par défaut
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# Routes
spring.cloud.gateway.routes[0].id=PROVIDER-SERVICE
spring.cloud.gateway.routes[0].uri=lb://PROVIDER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/providers/**

spring.cloud.gateway.routes[1].id=ARTICLE-SERVICE
spring.cloud.gateway.routes[1].uri=lb://ARTICLE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/articles/**